include "base.conf"

play.http.session.secure=false

slick.dbs {
  default {
    db.properties.url="postgres://bor_dev_user:dev@localhost:5432/bor_dev"
    db.characterEncoding="utf8"
    db.useUnicode=true
    db.numThreads=5
    db.minThreads=5
    db.maxThreads=5
    db.maxConnections=5
    db.queueSize=1000
  }
}

app.domain="localhost"
play.filters.hosts.allowed = [${app.domain}]

app.baseUrl = "http://localhost:9000"

// dev_secret.conf is a place for storing secrets like Mailgun's API key. It is added to .gitignore.
include "dev_secret.conf"
