name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: semeru
          java-version: '25'
          cache: 'sbt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache the target and node_modules folder
        uses: actions/cache@v4
        with:
          path: |
            ./target
            ./node_modules
          key: ${{ runner.os }}-publish-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-publish-
      - name: Install Node modules
        run: npm install
      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish docker image
        run: sbt clean stage docker:publish
        env:
          GIT_TAG: ${{ github.event.inputs.tag }}
      - name: Set the image tag in compose.yaml and install.sh
        run: |
          sed -i "s/GIT_TAG/${GIT_TAG}/g" ./compose.yaml
          sed -i "s/GIT_TAG/${GIT_TAG}/g" ./setup/install.sh
        env:
          GIT_TAG: ${{ github.event.inputs.tag }}
      - name: Create a release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          draft: false
          make_latest: false
          files: |
            ./compose.yaml
            ./setup/install.sh
          overwrite_files: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
